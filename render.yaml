services:
  - type: web
    name: ai-detection-dashboard
    env: python
    plan: starter
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://militaryobjectdetection-main.vercel.app
      - key: PORT
        value: 8000
