<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Detection Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// ============================================================
// Configuration
// ============================================================
// For local development, keep as empty string (API is same origin)
// For production (Vercel), set to your Render backend URL:
//   const BACKEND_URL = "https://your-app.onrender.com";
// ============================================================
const BACKEND_URL = "https://military-object-detection.onrender.com";
</script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI';
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
}

/* HEADER */
header {
    text-align: center;
    padding: 20px;
    font-size: 32px;
    font-weight: bold;
}
.container {
    display: flex;
    justify-content: center;
    gap: 20px;
}

.card {
    margin: 10px 0;
}
@media (max-width: 768px) {
    .container {
        flex-direction: column;
        align-items: center;
    }

    .card {
        width: 90%;
    }
}

/* TOP */
.top {
    text-align: center;
    margin: 20px;
}

button {
    padding: 12px 25px;
    border: none;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

/* GRID */
.grid {
    display: flex;
    gap: 20px;
    padding: 20px;
}

/* CARD */
.card {
    flex: 1;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
}

.card h2 {
    margin-bottom: 15px;
}

/* IMAGES */
img, canvas {
    width: 100%;
    border-radius: 10px;
}

/* RESULT */
#result p {
    margin: 5px 0;
}

/* FOOTER */
.footer {
    text-align: center;
    margin: 20px;
    opacity: 0.7;
}
</style>

</head>

<body>

<header>🚀 AI Detection Dashboard</header>

<div class="top">
    <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp">
    <br><br>
    <button onclick="uploadImage()">Predict</button>
</div>

<div class="grid">

    <!-- RESULTS -->
    <div class="card">
        <h2>Results</h2>
        <div id="result">No results yet...</div>
        <canvas id="chart"></canvas>
    </div>

    <!-- ORIGINAL -->
    <div class="card">
        <h2>Original</h2>
        <img id="preview">
    </div>

    <!-- DETECTION -->
    <div class="card">
        <h2>Detection</h2>
        <canvas id="canvas"></canvas>
    </div>

</div>

<div class="footer">
    Built with 💡 by Future Data Scientist
</div>

<!-- ================= JS ================= -->

<script>
let chart = null;

async function uploadImage() {
    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];

    if (!file) {
        alert("Select image first!");
        return;
    }

    const validExts = [".jpg", ".jpeg", ".png", ".webp"];
    const ext = "." + file.name.split(".").pop().toLowerCase();
    if (!validExts.includes(ext)) {
        alert("Only image files (JPG, JPEG, PNG, WEBP) are allowed.");
        return;
    }

    const resultBox = document.getElementById("result");
    const preview = document.getElementById("preview");
    preview.src = URL.createObjectURL(file);

    // Clear ALL previous detection state immediately
    resultBox.innerHTML = "⏳ Processing...";
    const canvas = document.getElementById("canvas");
    if (canvas) {
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    if (chart) {
        chart.destroy();
        chart = null;
    }

    const startTime = Date.now();

    const timerId = setInterval(() => {
        const sec = Math.floor((Date.now() - startTime) / 1000);
        if (sec < 120) {
            resultBox.innerHTML = `⏳ Processing... ${sec}s<br><small style="opacity:0.7">First prediction after a break may take up to 2 minutes (free hosting)</small>`;
        } else {
            resultBox.innerHTML = `⏳ Still processing... ${sec}s<br><small style="opacity:0.7">Almost done, please wait</small>`;
        }
    }, 1000);

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 180000);

    try {
        const formData = new FormData();
        formData.append("file", file);

        const response = await fetch(BACKEND_URL + "/predict", {
            method: "POST",
            body: formData,
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        clearInterval(timerId);

        if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error || `Server error (${response.status})`);
        }

        const data = await response.json();
        const elapsed = Math.floor((Date.now() - startTime) / 1000);

        displayResults(data, elapsed);
        drawBoxes(data);
        drawChart(data);

    } catch (error) {
        clearTimeout(timeoutId);
        clearInterval(timerId);

        if (error.name === "AbortError") {
            resultBox.innerHTML = `<p>⚠️ Request timed out (3 minutes).</p><p><small>The free hosting tier is too slow for this image. Try a smaller image or try again later.</small></p><p><button onclick="uploadImage()">Retry</button></p>`;
        } else {
            resultBox.innerHTML = `<p>❌ ${error.message}</p><p><button onclick="uploadImage()">Retry</button></p>`;
        }
    }
}
</script>

<script>
function displayResults(data, elapsed) {
    const resultBox = document.getElementById("result");
    let html = `<small style="opacity:0.6">⏱ ${elapsed}s</small><br>`;

    if (!data.detections || data.detections.length === 0) {
        resultBox.innerHTML = html + "❌ No military objects detected";
        return;
    }

    html += "✅ Military objects detected:<br><br>";
    data.detections.forEach(det => {
        html += `<p>🎯 <b>${det.class_name}</b> (${(det.confidence * 100).toFixed(1)}%)</p>`;
    });
    resultBox.innerHTML = html;
}
</script>

<script>
function drawBoxes(data) {

    const img = document.getElementById("preview");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    if (img.complete) {
        render();
    } else {
        img.onload = render;
    }

    function render() {

        canvas.width = img.clientWidth;
        canvas.height = img.clientHeight;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const scaleX = canvas.width / img.naturalWidth;
        const scaleY = canvas.height / img.naturalHeight;

        data.detections.forEach(det => {

            if (!det.box) return;

            let [x1, y1, x2, y2] = det.box;

            x1 *= scaleX;
            x2 *= scaleX;
            y1 *= scaleY;
            y2 *= scaleY;

            ctx.strokeStyle = "red";
            ctx.lineWidth = 2;
            ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);

            ctx.fillStyle = "red";
            ctx.font = "14px Arial";

            ctx.fillText(
                `${det.class_name}`,
                x1,
                y1 > 10 ? y1 - 5 : y1 + 15
            );
        });
    }
}
</script>

<script>
function drawChart(data) {

    const counts = {};

    data.detections.forEach(det => {
        counts[det.class_name] = (counts[det.class_name] || 0) + 1;
    });

    const labels = Object.keys(counts);
    const values = Object.values(counts);

    const ctx = document.getElementById("chart").getContext("2d");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Detected Objects',
                data: values
            }]
        }
    });
}
</script>

</body>
</html>
