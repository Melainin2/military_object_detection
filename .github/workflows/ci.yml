name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Lint with flake8
        run: |
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  check-dependencies:
    name: Check Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: Verify imports
        run: |
          python -c "
          import fastapi
          import uvicorn
          import cv2
          import huggingface_hub
          print('All dependencies import successfully')
          "

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets in codebase
        run: |
          # Check for potential secrets in tracked files
          set +e
          patterns=(
            "hf_[A-Za-z0-9_]+"
            "sk-[A-Za-z0-9]+"
            "ghp_[A-Za-z0-9_]+"
            "gho_[A-Za-z0-9_]+"
            "ghu_[A-Za-z0-9_]+"
            "ghs_[A-Za-z0-9_]+"
            "ghr_[A-Za-z0-9_]+"
          )
          found=0
          for pattern in "${patterns[@]}"; do
            matches=$(grep -rn "$pattern" --include="*.py" --include="*.html" --include="*.json" --include="*.yaml" --include="*.yml" --include="*.sh" --include="*.md" --include="*.txt" . 2>/dev/null | grep -v ".env.example" | grep -v "node_modules" || true)
            if [ -n "$matches" ]; then
              echo "WARNING: Possible secret found matching pattern $pattern"
              echo "$matches"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No secrets detected in codebase"
          fi

  validate-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend files exist
        run: |
          test -f frontend/index.html || { echo "frontend/index.html not found"; exit 1; }
          echo "Frontend files validated"

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t ai-detection-dashboard --build-arg BUILDKIT_INLINE_CACHE=1 .
